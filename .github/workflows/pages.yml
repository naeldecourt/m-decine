# Publie le site sur GitHub Pages à chaque poussée sur la branche par défaut.
# À utiliser avec Réglages → Pages → Source : « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: ["claude/edn-revision-site-m0x6fa"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Tamponner le cache du service worker
        # Sans empreinte unique, le cache garderait l'ancien JavaScript
        # indéfiniment chez les visiteurs déjà venus.
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" sw.js
          grep -n "var VERSION" sw.js

      - name: Préparer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
